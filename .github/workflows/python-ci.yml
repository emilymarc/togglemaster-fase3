# Pipeline compartilhado dos servicos em Python: flag-service,
# targeting-service e analytics-service.
# Nao roda sozinho — e chamado pelo workflow de cada servico.
name: reusable-python-ci

on:
  workflow_call:
    inputs:
      service_dir:
        description: "Pasta em services/ (ex.: flag)"
        required: true
        type: string
      service_name:
        description: "Nome do repositorio no ECR (ex.: flag-service)"
        required: true
        type: string

jobs:
  # ── Estagio 1: build e testes unitarios ─────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'      # mesma versao do Dockerfile
          cache: pip
          cache-dependency-path: services/${{ inputs.service_dir }}/requirements.txt

      - name: Dependencias
        run: pip install -r requirements.txt

      # Python nao compila num binario: o equivalente ao "go build"
      # e verificar que todos os modulos compilam sem erro de sintaxe.
      - name: Build (compilacao dos modulos)
        run: python -m compileall -q .

      # ATENCAO: pytest sem testes sai com codigo 5 e reprovaria o job.
      # O enunciado pede testes unitarios "se houver" — este passo
      # deixa explicito no log quando nao ha, em vez de esconder.
      - name: Testes unitarios
        run: |
          if compgen -G "test_*.py" > /dev/null || [ -d tests ]; then
            pip install pytest
            pytest -v
          else
            echo "Nenhum teste unitario neste servico — etapa ignorada."
            echo "O enunciado pede testes unitarios 'se houver'."
          fi

  # ── Estagio 2: analise estatica (em paralelo com o build) ───
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala o linter
        run: pip install flake8

      # Primeira passada: so erros graves — falha o job.
      - name: flake8 (erros)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Segunda passada: estilo — informativa, nao reprova.
      - name: flake8 (estilo)
        run: flake8 . --count --max-line-length=120 --statistics --exit-zero

  # ── Estagio 3: security scan — o gate ───────────────────────
  # Enunciado: SCA nas dependencias, SAST no codigo fonte, e
  # bloqueio se houver vulnerabilidade CRITICA.
  security-scan:
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4

      # SCA — varre as dependencias de requirements.txt contra
      # bases publicas de CVE.
      - name: Trivy — SCA (dependencias)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: 'services/${{ inputs.service_dir }}'
          severity: 'CRITICAL'
          exit-code: '1'          # <- a regra de bloqueio
          ignore-unfixed: 'true'  # ignora CVE que ainda nao tem correcao

      # SAST — varre o codigo fonte procurando padroes inseguros.
      # -lll: so severidade alta. -iii: so confianca alta.
      - name: bandit — SAST (codigo fonte)
        run: |
          pip install bandit
          bandit -r services/${{ inputs.service_dir }} -lll -iii

  docker-build-push:
    runs-on: ubuntu-latest
    needs: [security-scan]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Academy exige tres variaveis (inclui session token).
      # Configure em Settings > Secrets > Actions do repositorio:
      #   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN
      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # O login devolve o registry em steps.login-ecr.outputs.registry
      # (ex.: 123456789.dkr.ecr.us-east-1.amazonaws.com)
      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Short SHA de 7 caracteres como tag — rastreavel no git log.
      - name: Derivar tag e URL da imagem
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          REPO="togglemaster-${{ inputs.service_dir }}"
          echo "image=${REGISTRY}/${REPO}:${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${SHORT_SHA}"                       >> "$GITHUB_OUTPUT"

      - name: Docker build
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image }}" \
            services/${{ inputs.service_dir }}

      # Trivy escaneia a IMAGEM (camadas + pacotes do S.O.).
      # Diferente do passo anterior (trivy fs), que escaneava o codigo.
      # exit-code 1 bloqueia o pipeline em vulnerabilidade CRITICAL.
      - name: Trivy — scan da imagem (CRITICAL bloqueia)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: ${{ steps.meta.outputs.image }}
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: 'true'

      # So faz push em push na main (nao em PRs).
      # Em PRs: build + scan ja provam que a imagem e valida.
      - name: Push no ECR
        if: github.event_name == 'push'
        run: docker push "${{ steps.meta.outputs.image }}"

      # Atualiza o manifesto GitOps com a nova tag.
      # Fica em standby ate o Bloco 10 criar os manifests em gitops/.
      # [skip ci] evita loop infinito de triggers.
      - name: Atualizar tag no GitOps
        if: github.event_name == 'push'
        run: |
          MANIFEST="gitops/services/${{ inputs.service_dir }}/deployment.yaml"
          if [ -f "$MANIFEST" ]; then
            sed -i "s|image: .*togglemaster-${{ inputs.service_dir }}:.*|image: ${{ steps.meta.outputs.image }}|" "$MANIFEST"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$MANIFEST"
            git diff --cached --quiet || git commit -m "ci: ${{ inputs.service_dir }} -> ${{ steps.meta.outputs.tag }} [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "GitOps manifest ainda nao existe — sera ativado automaticamente no Bloco 10."
          fi


# Pipeline Go: auth-service e evaluation-service.
# e chamado por cada servico.
name: reusable-go-ci

on:
  workflow_call:
    inputs:
      service_dir:
        description: "Pasta em services/ (ex.: auth)"
        required: true
        type: string
      service_name:
        description: "Nome do repositorio no ECR (ex.: auth-service)"
        required: true
        type: string

jobs:
  
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/${{ inputs.service_dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'   
          cache-dependency-path: services/${{ inputs.service_dir }}/go.sum

      - name: Dependencias
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: go vet
        run: go vet ./...
# sem teste, o go test imprime "no test files" e sai 0.
      - name: Testes unitarios
        run: go test -v ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: services/${{ inputs.service_dir }}
          args: --timeout=5m

  # ── Estagio 3: security scan — o gate ───────────────────────
  # Enunciado: SCA nas dependencias, SAST no codigo fonte, e
  # bloqueio se houver vulnerabilidade CRITICA.
  security-scan:
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    steps:
      - uses: actions/checkout@v4

      # SCA — varre as dependencias declaradas em go.mod/go.sum
      # contra bases publicas de CVE.
      - name: Trivy — SCA (dependencias)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: 'services/${{ inputs.service_dir }}'
          severity: 'CRITICAL'
          exit-code: '1'          # <- a regra de bloqueio
          ignore-unfixed: 'true'  # ignora CVE que ainda nao tem correcao

      # SAST — varre o codigo fonte procurando padroes inseguros
      # (credencial no codigo, SQL concatenado, cripto fraca).
      - name: gosec — SAST (codigo fonte)
        uses: securego/gosec@master
        with:
          args: '-severity high -confidence high ./services/${{ inputs.service_dir }}/...'
  # ── Bloco 9 entra aqui: docker-build-push ───────────────────
  # ── Bloco 10 entra aqui: update-gitops ──────────────────────
